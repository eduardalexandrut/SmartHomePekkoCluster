pekko {
  loglevel = "INFO"

  actor {
    provider = "cluster"

    # Every message implementing CborSerializable is serialized with Jackson
    # when it is sent to another node.
    serialization-bindings {
      "org.example.CborSerializable" = jackson-cbor
    }
  }

  serialization.jackson.serialization-features {
    # Some messages have no fields (e.g. ActivateSiren)
    FAIL_ON_EMPTY_BEANS = off
  }

  remote.artery.canonical.hostname = "127.0.0.1"

  cluster {
    # If a node crashes, the split brain resolver removes it from the cluster
    # after it has been unreachable for "stable-after". Then the Cluster
    # Singleton manager can recreate the ControlUnit on another "control" node.
    downing-provider-class = "org.apache.pekko.cluster.sbr.SplitBrainResolverProvider"
    split-brain-resolver.stable-after = 7s
  }
}